services:
  nginx:
    container_name: nginx_${APP_NETWORK}
    image: nginx:latest
    ports:
      - "${APP_PORT:-8081}:80"
    volumes:
      - './:/var/www/app'
      - './.docker/nginx/default.conf:/etc/nginx/conf.d/default.conf'
    networks:
      - ${APP_NETWORK}
  php:
    build:
      context: ./.docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}
    container_name: php_${APP_NETWORK}
    volumes:
      - './:/var/www/app'
    networks:
      - ${APP_NETWORK}
  db:
    image: mysql
    restart: always
    container_name: db_${APP_NETWORK}
    ports:
      - "3365:3306"
    volumes:
      - './.docker/mysql:/var/lib/mysql'
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    networks:
      - ${APP_NETWORK}
  scheduler:
    container_name: scheduler_${APP_NETWORK}
    build:
      context: ./.docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}

    working_dir: /var/www/app

    volumes:
      - './:/var/www/app'

    command: php artisan schedule:work

    restart: unless-stopped

    depends_on:
      - php

    networks:
      - ${APP_NETWORK}
  queue:
    container_name: queue_${APP_NETWORK}
    build:
      context: ./.docker/php
      args:
        UID: ${UID:-1000}
        GID: ${GID:-1000}

    working_dir: /var/www/app

    volumes:
      - './:/var/www/app'

    command: php artisan queue:work --sleep=1 --tries=5 --timeout=1200

    restart: unless-stopped

    depends_on:
      - php

    networks:
      - ${APP_NETWORK}
